name: Supabase keep-alive

# Supabase 免费版在 7 天无活动后会暂停项目。
# 这个 workflow 每 3 天查询一次数据库，保持项目活跃。
on:
  schedule:
    - cron: "0 6 */3 * *" # 每 3 天 UTC 06:00
  workflow_dispatch: # 也可以在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Supabase
        run: |
          set -euo pipefail
          # 直接读仓库里已提交的 .env（anon key 本来就是公开的 publishable key）
          read_env() {
            grep -E "^$1=" .env | head -1 | cut -d= -f2- | tr -d '"\r'
          }
          SUPABASE_URL=$(read_env VITE_SUPABASE_URL)
          SUPABASE_KEY=$(read_env VITE_SUPABASE_PUBLISHABLE_KEY)

          # 真正打到 Postgres 的一次查询，而不只是碰一下 API 网关
          status=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/households?select=id&limit=1")

          echo "HTTP ${status}"
          cat /tmp/body.txt

          if [ "$status" != "200" ]; then
            echo "::error::Supabase keep-alive 失败（HTTP ${status}）——项目可能已暂停，去 Dashboard 点 Restore project"
            exit 1
          fi
